<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Error 404 - Lechuga AI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f3f7f4,
                    #dff1e3
                );

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        .container{

            background:white;

            border-radius:20px;

            padding:60px 40px;

            text-align:center;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.08);
        }

        h1{

            font-size:80px;

            color:#1f6d36;

            margin-bottom:10px;
        }

        h2{

            font-size:24px;

            color:#666;

            margin-bottom:30px;
        }

        a{

            padding:14px 30px;

            background:#1e8e3e;

            color:white;

            border-radius:12px;

            text-decoration:none;

            font-weight:bold;

            transition:0.3s;
        }

        a:hover{

            background:#176d31;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>404</h1>

        <h2>Pagina no encontrada</h2>

        <a href="/">Volver al inicio</a>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riego AI - Predicción de Vaciado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 6px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full { grid-column: 1 / -1; }

        label {
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        label .unit {
            color: #64748b;
            font-weight: 400;
        }

        input {
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -5px rgba(56, 189, 248, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(15, 23, 42, 0.2);
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn.loading .btn-text { display: none; }
        .btn.loading .spinner { display: block; }

        .result-card {
            display: none;
            margin-top: 20px;
            padding: 24px;
            border-radius: 16px;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card.normal { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); }
        .result-card.minimo { background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.3); }
        .result-card.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); }

        .result-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .status-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge.normal { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .status-badge.minimo { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .status-badge.error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .result-title {
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 600;
        }

        .result-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .result-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 12px 14px;
        }

        .result-item .r-label {
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-item .r-value {
            color: #e2e8f0;
            font-size: 18px;
            font-weight: 700;
            margin-top: 2px;
        }

        .result-item .r-value.time {
            color: #38bdf8;
            font-size: 24px;
        }

        .result-full {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 14px 16px;
            color: #e2e8f0;
            font-size: 14px;
            text-align: center;
        }

        .tank-visual {
            margin: 20px 0 10px;
            position: relative;
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tank-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 20px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #0f172a;
            min-width: 40px;
        }

        .tank-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .container { padding: 24px; }
            .input-grid, .btn-group, .result-body { grid-template-columns: 1fr; }
            .header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Riego AI</h1>
            <p>Predicción de tiempo de vaciado de tanque de agua</p>
        </div>

        <form id="predictForm">
            <div class="input-grid">
                <div class="form-group">
                    <label for="cantidad">Nivel actual <span class="unit">(litros)</span></label>
                    <input type="number" id="cantidad" step="0.1" min="0" value="120" required>
                </div>
                <div class="form-group">
                    <label for="threshold">Nivel mínimo <span class="unit">(litros)</span></label>
                    <input type="number" id="threshold" step="0.1" min="0" value="20" required>
                </div>
                <div class="form-group full">
                    <label for="caudal">Caudal de bomba <span class="unit">(L/s)</span></label>
                    <input type="number" id="caudal" step="0.001" min="0.001" value="0.075" required>
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="btnManual">
                    <span class="btn-text">Predecir manual</span>
                    <div class="spinner"></div>
                </button>
                <button type="button" class="btn btn-secondary" id="btnBD">
                    <span class="btn-text">Predecir desde BD</span>
                    <div class="spinner"></div>
                </button>
            </div>
        </form>

        <div class="tank-visual" id="tankVisual">
            <div class="tank-fill" id="tankFill" style="width:100%">120 L</div>
        </div>
        <div class="tank-labels">
            <span>0 L</span>
            <span id="tankThreshold">Umbral: 20 L</span>
            <span id="tankMax">120 L</span>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-header">
                <span class="status-badge" id="statusBadge">NORMAL</span>
                <span class="result-title" id="resultTitle">Tanque con nivel suficiente</span>
            </div>
            <div class="result-body" id="resultBody">
                <div class="result-item">
                    <div class="r-label">Tiempo estimado</div>
                    <div class="r-value time" id="rTiempo">--</div>
                </div>
                <div class="result-item">
                    <div class="r-label">Estado</div>
                    <div class="r-value" id="rEstado">--</div>
                </div>
                <div class="result-item">
                    <div class="r-label">Volumen a vaciar</div>
                    <div class="r-value" id="rVolumen">--</div>
                </div>
                <div class="result-item">
                    <div class="r-label">Caudal</div>
                    <div class="r-value" id="rCaudal">--</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('predictForm');
        const btnManual = document.getElementById('btnManual');
        const btnBD = document.getElementById('btnBD');
        const resultCard = document.getElementById('resultCard');
        const statusBadge = document.getElementById('statusBadge');
        const resultTitle = document.getElementById('resultTitle');
        const resultBody = document.getElementById('resultBody');
        const tankFill = document.getElementById('tankFill');
        const tankThreshold = document.getElementById('tankThreshold');

        const inputCantidad = document.getElementById('cantidad');
        const inputThreshold = document.getElementById('threshold');
        const inputCaudal = document.getElementById('caudal');

        function actualizarTanque(cantidad, threshold, maxVal) {
            const pct = Math.min(100, Math.max(0, (cantidad / maxVal) * 100));
            tankFill.style.width = pct + '%';
            tankFill.textContent = Math.round(cantidad) + ' L';
            tankThreshold.textContent = 'Umbral: ' + threshold + ' L';
        }

        inputCantidad.addEventListener('input', function() {
            const max = Math.max(parseFloat(this.value) || 100, parseFloat(inputThreshold.value) + 10);
            actualizarTanque(parseFloat(this.value) || 0, parseFloat(inputThreshold.value) || 0, max);
        });
        inputThreshold.addEventListener('input', function() {
            const max = Math.max(parseFloat(inputCantidad.value) || 100, parseFloat(this.value) + 10);
            actualizarTanque(parseFloat(inputCantidad.value) || 0, parseFloat(this.value) || 0, max);
        });

        function mostrarResultado(data) {
            resultCard.style.display = 'block';
            resultCard.className = 'result-card';

            if (!data.success) {
                resultCard.classList.add('error');
                statusBadge.className = 'status-badge error';
                statusBadge.textContent = 'Error';
                resultTitle.textContent = 'Error en la solicitud';
                resultBody.innerHTML = `<div class="result-full">${data.message || data.error || 'Error desconocido'}</div>`;

                if (data.nivel_actual !== undefined) {
                    actualizarTanque(data.nivel_actual, data.nivel_minimo || 0, data.nivel_actual * 1.5);
                }
                return;
            }

            const esMinimo = data.estado === 'TANQUE_EN_NIVEL_MINIMO';

            if (esMinimo) {
                resultCard.classList.add('minimo');
                statusBadge.className = 'status-badge minimo';
                statusBadge.textContent = 'Minimo';
                resultTitle.textContent = 'Tanque en nivel minimo';
            } else {
                resultCard.classList.add('normal');
                statusBadge.className = 'status-badge normal';
                statusBadge.textContent = 'Normal';
                resultTitle.textContent = 'Tanque con nivel suficiente';
            }

            const maxVal = Math.max(data.nivel_actual, data.nivel_minimo) * 1.5;
            actualizarTanque(data.nivel_actual, data.nivel_minimo, maxVal);

            resultBody.innerHTML = `
                <div class="result-item">
                    <div class="r-label">Tiempo estimado</div>
                    <div class="r-value time">${data.tiempo_formateado}</div>
                </div>
                <div class="result-item">
                    <div class="r-label">Estado</div>
                    <div class="r-value">${esMinimo ? 'En nivel minimo' : 'Vaciando'}</div>
                </div>
                <div class="result-item">
                    <div class="r-label">Volumen a vaciar</div>
                    <div class="r-value">${data.volumen_a_vaciar} L</div>
                </div>
                <div class="result-item">
                    <div class="r-label">Caudal</div>
                    <div class="r-value">${data.caudal_bomba} L/s</div>
                </div>
                <div class="result-item">
                    <div class="r-label">Nivel actual</div>
                    <div class="r-value">${data.nivel_actual} L</div>
                </div>
                <div class="result-item">
                    <div class="r-label">Nivel minimo</div>
                    <div class="r-value">${data.nivel_minimo} L</div>
                </div>
                ${data.tiempo_segundos > 0 ? `
                <div class="result-item">
                    <div class="r-label">Segundos exactos</div>
                    <div class="r-value">${data.tiempo_segundos} s</div>
                </div>` : ''}
            `;
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(btnManual, true);
            resultCard.style.display = 'none';

            const payload = {
                cantidad: parseFloat(inputCantidad.value),
                threshold_minimo: parseFloat(inputThreshold.value),
                caudal_bomba_lps: parseFloat(inputCaudal.value)
            };

            try {
                const resp = await fetch('/riego/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                mostrarResultado(data);
            } catch (err) {
                resultCard.style.display = 'block';
                resultCard.className = 'result-card error';
                statusBadge.className = 'status-badge error';
                statusBadge.textContent = 'Error';
                resultTitle.textContent = 'Error de conexion';
                resultBody.innerHTML = '<div class="result-full">No se pudo conectar con el servidor.</div>';
            } finally {
                setLoading(btnManual, false);
            }
        });

        btnBD.addEventListener('click', async () => {
            setLoading(btnBD, true);
            resultCard.style.display = 'none';

            try {
                const resp = await fetch('/riego/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ desde_bd: true })
                });
                const data = await resp.json();
                mostrarResultado(data);
            } catch (err) {
                resultCard.style.display = 'block';
                resultCard.className = 'result-card error';
                statusBadge.className = 'status-badge error';
                statusBadge.textContent = 'Error';
                resultTitle.textContent = 'Error de conexion';
                resultBody.innerHTML = '<div class="result-full">No se pudo conectar con el servidor.</div>';
            } finally {
                setLoading(btnBD, false);
            }
        });

        actualizarTanque(120, 20, 180);
    </script>
</body>
</html>
